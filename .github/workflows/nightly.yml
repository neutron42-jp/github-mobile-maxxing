name: Nightly Release

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 18 * * *' # 03:00 JST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  nightly:
    name: Build & Publish Nightly (APK & AppImage)
    runs-on: ubuntu-latest
    if: github.repository == 'neutron42-jp/github-mobile-maxxing'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if nightly is already up to date (schedule only)
        id: check_up_to_date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          NIGHTLY_SHA="$(git ls-remote --tags origin refs/tags/nightly 'refs/tags/nightly^{}' | tail -n 1 | awk '{print $1}')"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$NIGHTLY_SHA" ] && [ "$NIGHTLY_SHA" = "$HEAD_SHA" ] && gh release view nightly >/dev/null 2>&1; then
            echo "Nightly release already matches main ($HEAD_SHA); skipping scheduled rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check_up_to_date.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.check_up_to_date.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK licenses accepted
        if: steps.check_up_to_date.outputs.skip != 'true'
        run: |
          if [ -d "${ANDROID_HOME:-}/cmdline-tools" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Run test suite
        if: steps.check_up_to_date.outputs.skip != 'true'
        run: |
          ./gradlew \
            :core:model:desktopTest \
            :core:auth:desktopTest \
            :core:ui:desktopTest \
            :core:network:desktopTest \
            :composeApp:desktopTest \
            :composeApp:testAndroidHostTest \
            --no-daemon

      - name: Decode Android release keystore & resolve version metadata
        if: steps.check_up_to_date.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing; refusing to sign nightly release with ephemeral debug key." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/maxxing-release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/maxxing-release.jks" >> "$GITHUB_ENV"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y%m%d)"
          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          MAJOR_MINOR="$(printf '%s' "$LATEST_TAG" | sed -n 's/^v\([0-9]\+\.[0-9]\+\)\.[0-9]\+$/\1/p')"
          MAJOR_MINOR="${MAJOR_MINOR:-1.0}"
          VERSION_NAME="${MAJOR_MINOR}.${COMMIT_COUNT}-nightly.${SHORT_SHA}"
          echo "ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "COMMIT_COUNT=${COMMIT_COUNT}" >> "$GITHUB_ENV"

      - name: Build Android Release APK
        if: steps.check_up_to_date.outputs.skip != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Build Linux AppImage
        if: steps.check_up_to_date.outputs.skip != 'true'
        run: ./gradlew :composeApp:packageLinuxAppImage --no-daemon

      - name: Prepare Nightly Artifacts
        if: steps.check_up_to_date.outputs.skip != 'true'
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk github-mobile-maxxing-nightly.apk
          cp composeApp/build/compose/binaries/main/appimage/github-mobile-maxxing-x86_64.AppImage github-mobile-maxxing-nightly-x86_64.AppImage
          sha256sum github-mobile-maxxing-nightly.apk github-mobile-maxxing-nightly-x86_64.AppImage > nightly-checksums.txt

      - name: Update Nightly Tag & Publish Prerelease
        if: steps.check_up_to_date.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          CHECKSUMS="$(cat nightly-checksums.txt)"
          {
            printf 'Automated Nightly build from `main` (%s, commit `%s`).\n\n' "$BUILD_DATE" "$SHORT_SHA"
            printf -- '- **Version**: `%s` (versionCode `%s`)\n' "$ANDROID_VERSION_NAME" "$((COMMIT_COUNT + 100))"
            printf -- '- **Latest commit**: %s\n\n' "$COMMIT_MSG"
            printf '### SHA-256 Checksums\n```\n%s\n```\n' "$CHECKSUMS"
          } > nightly-notes.md

          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa nightly -m "Nightly build from main (${SHORT_SHA})" "$HEAD_SHA"
          git push origin refs/tags/nightly --force

          gh release create nightly \
            github-mobile-maxxing-nightly.apk \
            github-mobile-maxxing-nightly-x86_64.AppImage \
            --prerelease \
            --title "github-mobile-maxxing v${ANDROID_VERSION_NAME}" \
            --notes-file nightly-notes.md
