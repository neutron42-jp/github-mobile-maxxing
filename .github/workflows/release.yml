name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK licenses accepted
        run: |
          if [ -d "${ANDROID_HOME:-}/cmdline-tools" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Run test suite
        run: |
          ./gradlew \
            :core:model:desktopTest \
            :core:auth:desktopTest \
            :core:ui:desktopTest \
            :core:network:desktopTest \
            :composeApp:desktopTest \
            :composeApp:testAndroidHostTest \
            --no-daemon

      - name: Resolve and validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG_NAME="$(bash scripts/validate-release-tag.sh "$RELEASE_TAG")"
          printf 'TAG_NAME=%s\n' "$TAG_NAME" >> "$GITHUB_ENV"
          printf 'ANDROID_VERSION_NAME=%s\n' "${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Decode Android release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing; refusing to sign release with ephemeral debug key." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/maxxing-release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/maxxing-release.jks" >> "$GITHUB_ENV"

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Build Linux AppImage
        run: ./gradlew :composeApp:packageLinuxAppImage --no-daemon

      - name: Prepare Release Artifacts
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk github-mobile-maxxing-release.apk
          cp composeApp/build/compose/binaries/main/appimage/github-mobile-maxxing-x86_64.AppImage github-mobile-maxxing-x86_64.AppImage

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${TAG_NAME:?release tag was not validated}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              github-mobile-maxxing-release.apk \
              github-mobile-maxxing-x86_64.AppImage \
              --clobber
          else
            gh release create "$TAG_NAME" \
              github-mobile-maxxing-release.apk \
              github-mobile-maxxing-x86_64.AppImage \
              --title "github-mobile-maxxing $TAG_NAME" \
              --generate-notes
          fi
