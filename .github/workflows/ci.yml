name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Desktop Tests & Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK licenses accepted
        run: |
          if [ -d "${ANDROID_HOME:-}/cmdline-tools" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Run KMP Desktop tests & build Desktop target
        run: |
          ./gradlew \
            :core:model:desktopTest \
            :core:auth:desktopTest \
            :core:ui:desktopTest \
            :core:network:desktopTest \
            :composeApp:desktopTest \
            :composeApp:testAndroidHostTest \
            :composeApp:desktopMainClasses \
            --no-daemon

      - name: Check iOS Kotlin compilation
        run: |
          ./gradlew \
            :core:model:compileKotlinIosArm64 \
            :core:auth:compileKotlinIosArm64 \
            :core:ui:compileKotlinIosArm64 \
            :core:network:compileKotlinIosArm64 \
            :composeApp:compileKotlinIosArm64 \
            :core:auth:compileTestKotlinIosSimulatorArm64 \
            :core:ui:compileTestKotlinIosSimulatorArm64 \
            :core:network:compileTestKotlinIosSimulatorArm64 \
            :composeApp:compileTestKotlinIosSimulatorArm64 \
            --no-daemon

      - name: Decode Android release keystore if configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/maxxing-release.jks"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/maxxing-release.jks" >> "$GITHUB_ENV"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE_COUNT="$(git rev-list --count "${{ github.event.pull_request.base.sha }}")"
            echo "ANDROID_VERSION_CODE=$((BASE_COUNT + 100))" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Build Linux AppImage
        run: ./gradlew :composeApp:packageLinuxAppImage --no-daemon

      - name: Verify Compose resources bundled in APK
        run: unzip -l androidApp/build/outputs/apk/release/androidApp-release.apk | grep -q "assets/composeResources/.*/app_icon.png"

      - name: Verify Linux AppImage artifact generated
        run: test -x composeApp/build/compose/binaries/main/appimage/github-mobile-maxxing-x86_64.AppImage

      - name: Upload Desktop test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: '**/build/test-results/desktopTest/TEST-*.xml'
          if-no-files-found: ignore

      - name: Stage named Release APK artifact
        run: cp androidApp/build/outputs/apk/release/androidApp-release.apk github-mobile-maxxing-release.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-mobile-maxxing-release-apk
          path: github-mobile-maxxing-release.apk

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-mobile-maxxing-linux-appimage
          path: composeApp/build/compose/binaries/main/appimage/github-mobile-maxxing-x86_64.AppImage
