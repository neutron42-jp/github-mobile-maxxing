[package]
name = "local-client-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "local_client_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
hex.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
local-protocol = { path = "../local-protocol" }
thiserror.workspace = true
tokio.workspace = true
uniffi = "0.32.2"
