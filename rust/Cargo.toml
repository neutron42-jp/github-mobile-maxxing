[workspace]
resolver = "2"
members = [
    "local-protocol",
    "local-cli",
    "local-client-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
hex = "0.4"
iroh = "1.5.0"
iroh-tickets = "1.0.0"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "net"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
